<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fice's Campsite</title>
    <link rel="stylesheet" href="blueprints.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Cairo+Play:wght@400;700&family=Red+Rose:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-gif-overlay"></div>

    <!-- Fullscreen GIF Overlay -->
    <div id="gif-overlay" class="fullscreen-gif-overlay">
        <img id="transition-gif" src="" alt="Transition GIF">
    </div>

    <!-- Fard Estiregg -->
    <div id="konami-overlay" class="konami-overlay">
        <div class="konami-modal">
            <img id="konami-img" src="https://media.discordapp.net/attachments/1555657609816834133/1560338844354613308/IMG_4412.png?ex=6ad25a4a&is=6ad108ca&hm=792e993f5e04cc3b3eb321c850fa21307b47f714514425967c416c30ff85cf37&=&format=webp&quality=lossless&width=1024&height=658" alt="Fard_15 Unlocked!">
            <p class="konami-text">FARD_15 UNLOCKED!</p>
            <button id="close-konami-btn" class="close-konami-btn">[ CLOSE ]</button>
        </div>
    </div>

    <div class="campsite-container">
        
        <aside class="sidebar" data-badge="burp">
            <div class="sidebar-top">
                <div class="sidebar-brand">
                    <h2>Fice's Space</h2>
                </div>
                
                <nav class="menu-tabs">
                    <ul>
                        <li><a href="#" class="menu-link active" data-target="about">About</a></li>
                        <li><a href="#" class="menu-link" data-target="cacocede">Cacocede</a></li>
                        <li><a href="#" class="menu-link" data-target="galeria">Gallery</a></li>
                    </ul>
                </nav>
            </div>
            
            <!-- Last.fm Radio Widget -->
            <div class="music-widget-placeholder" id="lastfm-widget">
                <div class="music-widget-header">
                    <span class="widget-radio-label" id="music-icon">RADIO</span>
                    <span class="music-status-tag" id="music-status">OFFLINE</span>
                </div>
                
                <div class="music-track-info">
                    <img id="album-cover" class="album-cover hidden" src="" alt="Album Cover">
                    <div class="track-text">
                        <p id="track-name">Radio Campsite</p>
                        <span class="subtext" id="artist-name">Cargando Last.fm...</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content" data-badge="brain empty, no thoughts">
            <!-- Protruding Theme Button -->
            <button id="random-theme-btn" class="random-theme-btn" title="Randomize Palette">🎨 PALETTE</button>
            
            <div id="dynamic-tab-content">
            </div>

            <footer class="social-networks">
                <div class="social-badges-row">
                    <a href="https://youtube.com" target="_blank" class="social-badge-link" title="YouTube">
                        <img src="https://img.shields.io/badge/YouTube-FF0000?style=for-the-badge&logo=youtube&logoColor=white" alt="YouTube">
                    </a>
                    <a href="https://twitch.tv" target="_blank" class="social-badge-link" title="Twitch">
                        <img src="https://img.shields.io/badge/Twitch-9146FF?style=for-the-badge&logo=twitch&logoColor=white" alt="Twitch">
                    </a>
                    <a href="https://instagram.com" target="_blank" class="social-badge-link" title="Instagram">
                        <img src="https://img.shields.io/badge/Instagram-E4405F?style=for-the-badge&logo=instagram&logoColor=white" alt="Instagram">
                    </a>
                </div>
            </footer>
        </main>

    </div>

    <script src="synergy.js" defer></script>
</body>
</html>
